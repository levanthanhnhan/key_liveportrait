<!doctype html>
<html lang="vi">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Avatar Motion Control</title>
  <link rel="stylesheet" href="/style.css" />
</head>

<body>
  <main class="app">
    <section class="hero">
      <div>
        <p class="eyebrow">LivePortrait + Colab GPU</p>
        <h1>Avatar Motion Control</h1>
        <p class="subtitle">Upload ảnh khuôn mặt và video motion, Render sẽ gửi job sang Colab để xử lý GPU.</p>
      </div>
      <div class="status" id="status">Ready</div>
    </section>

    <section class="panel input-panel">
      <div class="upload-grid equal-upload-grid">
        <div class="upload-card">
          <label class="dropzone upload-icon-box" for="images">
            <span class="upload-icon">📸</span>
            <span>Source Images</span>
            <small>Upload nhiều ảnh JPG/PNG/WebP</small>
            <input id="images" type="file" accept="image/*" multiple hidden />
          </label>

          <div id="imagePreview" class="image-preview-grid"></div>
        </div>

        <div class="upload-card">
          <label class="dropzone upload-icon-box" for="video">
            <span class="upload-icon">🎬</span>
            <span>Driving Video</span>
            <small>Video mẫu motion MP4/MOV</small>
            <input id="video" type="file" accept="video/*" hidden />
          </label>

          <div id="videoPreview" class="video-preview-box"></div>
        </div>
      </div>

      <div class="controls">
        <div class="control"><label>Grain <b id="grainValue">3.0</b></label><input id="grain" type="range" min="0"
            max="10" step="0.1" value="3.0" /></div>
        <div class="control"><label>Motion blur <b id="blurValue">0.08</b></label><input id="blur" type="range" min="0"
            max="0.25" step="0.01" value="0.08" /></div>
        <div class="control"><label>Brightness <b id="brightnessValue">0</b></label><input id="brightness" type="range"
            min="-30" max="30" step="1" value="0" /></div>
        <div class="control"><label>Contrast <b id="contrastValue">1.00</b></label><input id="contrast" type="range"
            min="0.7" max="1.4" step="0.01" value="1.00" /></div>
        <div class="control"><label>Gamma <b id="gammaValue">1.00</b></label><input id="gamma" type="range" min="0.7"
            max="1.4" step="0.01" value="1.00" /></div>
        <div class="control"><label>Saturation <b id="saturationValue">1.00</b></label><input id="saturation"
            type="range" min="0.5" max="1.5" step="0.01" value="1.00" /></div>
        <div class="control"><label>Sharpen <b id="sharpenValue">0.12</b></label><input id="sharpen" type="range"
            min="0" max="0.4" step="0.01" value="0.12" /></div>
        <div class="control"><label>Driving multiplier <b id="drivingValue">1.00</b></label><input id="driving"
            type="range" min="0.2" max="2" step="0.05" value="1.00" /></div>
      </div>

      <button id="generateBtn">Generate Video</button>
    </section>

    <section class="panel output-panel">
      <div class="output-header">
        <h2>Output</h2>
        <a id="downloadLink" class="download hidden" download="output.mp4">Download video</a>
      </div>
      <video id="outputVideo" controls playsinline preload="metadata"></video>
      <pre id="log"></pre>
    </section>
  </main>
  <script src="/app.js"></script>
</body>

</html>
