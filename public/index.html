<!doctype html>
<html lang="vi">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Avatar Motion Control</title>
  <link rel="stylesheet" href="/style.css" />
</head>

<body>
  <main class="app">
    <section class="hero">
      <div>
        <p class="eyebrow">Key DeepFace</p>
        <h1>Video Motion Control</h1>
        <p class="subtitle">Upload ảnh khuôn mặt và video motion.</p>
      </div>
    </section>

    <section class="panel input-panel">
      <div class="upload-grid equal-upload-grid">
        <div class="upload-card">
          <label class="dropzone upload-icon-box" for="images">
            <span class="upload-icon">📸</span>
            <span>Upload Image</span>
            <small>Upload ảnh mẫu</small>
            <input id="images" type="file" accept="image/*" multiple hidden />
          </label>

          <div id="imagePreview" class="image-preview-grid"></div>
        </div>

        <div class="upload-card">
          <label class="dropzone upload-icon-box" for="video">
            <span class="upload-icon">🎬</span>
            <span>Upload Video</span>
            <small>Upload video motion</small>
            <input id="video" type="file" accept="video/*" hidden />
          </label>

          <div id="videoPreview" class="video-preview-box"></div>
        </div>
      </div>

      <div class="controls">
        <div class="control"><label>Grain <b id="grainValue">14.0</b></label><input id="grain" type="range" min="0"
            max="25" step="0.5" value="14.0"></div>

        <div class="control"><label>Motion blur <b id="blurValue">0.24</b></label><input id="blur" type="range" min="0"
            max="0.6" step="0.01" value="0.24"></div>

        <div class="control"><label>Brightness <b id="brightnessValue">-6</b></label><input id="brightness" type="range"
            min="-30" max="30" step="1" value="-6"></div>

        <div class="control"><label>Contrast <b id="contrastValue">0.82</b></label><input id="contrast" type="range"
            min="0.5" max="1.5" step="0.01" value="0.82"></div>

        <div class="control"><label>Gamma <b id="gammaValue">1.12</b></label><input id="gamma" type="range" min="0.7"
            max="1.5" step="0.01" value="1.12"></div>

        <div class="control"><label>Saturation <b id="saturationValue">0.82</b></label><input id="saturation"
            type="range" min="0.5" max="1.5" step="0.01" value="0.82"></div>

        <div class="control"><label>Sharpen <b id="sharpenValue">0.00</b></label><input id="sharpen" type="range"
            min="0" max="1" step="0.01" value="0.00"></div>

        <div class="control"><label>Driving multiplier <b id="drivingValue">0.95</b></label><input id="driving"
            type="range" min="0.3" max="1.2" step="0.01" value="0.95"></div>
      </div>

      <button id="generateBtn">Generate Video</button>
    </section>

    <section class="panel output-panel">
      <div class="output-header">
        <h2>Output</h2>
        <div class="status" id="status">Ready</div>
        <a id="downloadLink" class="download hidden" download="output.mp4">Download video</a>
      </div>
      <video id="outputVideo" controls playsinline preload="auto"></video>
      <pre id="log"></pre>
    </section>
  </main>
  <script src="/app.js"></script>
</body>

</html>
